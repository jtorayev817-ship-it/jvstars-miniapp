<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050817">

    <title>JV Stars</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050817;
            --card: #0d1226;
            --card2: #111832;
            --text: #ffffff;
            --muted: #8992ad;
            --blue: #4d7cff;
            --cyan: #00d9ff;
            --purple: #8b5cf6;
            --green: #20d67b;
            --border: rgba(255,255,255,0.08);
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(77,124,255,0.28), transparent 40%),
                radial-gradient(circle at 100% 40%, rgba(139,92,246,0.14), transparent 35%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 18px 15px 35px;
        }

        /* HEADER */

        .header {
            position: relative;
            text-align: center;
            margin-bottom: 20px;
        }

        .lang-switch {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.055);
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
        }

        .lang-btn.active {
            color: white;
            border-color: rgba(77,124,255,0.6);
            background: linear-gradient(145deg, rgba(77,124,255,0.28), rgba(139,92,246,0.2));
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #62dfff, #8d6cff, #ffffff);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 5s linear infinite;
            text-shadow: 0 0 25px rgba(77,124,255,0.35);
        }

        @keyframes glowText {
            0%   { background-position: 0% center; }
            50%  { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .bot-link {
            display: inline-block;
            margin-top: 5px;
            color: #8fdfff;
            font-size: 14px;
            text-decoration: none;
        }

        /* BALANCE */

        .balance-card {
            background: linear-gradient(135deg, rgba(77,124,255,0.18), rgba(139,92,246,0.12));
            border: 1px solid rgba(120,150,255,0.18);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 22px;
            box-shadow: 0 0 35px rgba(77,124,255,0.08);
        }

        .balance-title {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .balance {
            font-size: 28px;
            font-weight: 800;
        }

        .uzs {
            font-size: 14px;
            color: var(--muted);
            margin-left: 5px;
        }

        /* PAGES */

        .page { display: none; }

        .page.active {
            display: block;
            animation: pageIn 0.25s ease;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .section-description {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 18px;
        }

        /* SERVICES */

        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .service {
            position: relative;
            overflow: hidden;
            min-height: 145px;
            background: linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018));
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px 16px;
            color: white;
            text-align: left;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .service:hover,
        .service:active {
            transform: translateY(-2px);
            border-color: rgba(90,150,255,0.45);
            box-shadow: 0 0 28px rgba(77,124,255,0.13);
        }

        .service::after {
            content: "";
            position: absolute;
            width: 80px;
            height: 80px;
            right: -30px;
            bottom: -35px;
            border-radius: 50%;
            background: rgba(77,124,255,0.14);
            filter: blur(15px);
        }

        .service-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .service-name {
            font-size: 16px;
            font-weight: 800;
        }

        .service-desc {
            color: var(--muted);
            font-size: 11px;
            margin-top: 5px;
        }

        /* FORM */

        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .label {
            display: block;
            color: #aeb6ce;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            background: #080d1d;
            color: white;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 14px;
            padding: 14px;
            outline: none;
            font-size: 16px; /* iOS'da yaqinlashib ketmasligi uchun */
            transition: border-color 0.2s;
        }

        textarea {
            display: block;
            resize: none;
            min-height: 86px;
            line-height: 1.4;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: rgba(77,124,255,0.65);
        }

        input.invalid {
            border-color: rgba(255,92,122,0.75);
        }

        input::placeholder,
        textarea::placeholder {
            color: #5d6680;
        }

        .field-note {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 7px;
            color: var(--muted);
            font-size: 11px;
        }

        .recipient-row {
            display: flex;
            gap: 8px;
        }

        .recipient-row input {
            flex: 1;
            min-width: 0;
        }

        .small-button {
            white-space: nowrap;
            background: rgba(77,124,255,0.14);
            color: #8fc2ff;
            border: 1px solid rgba(77,124,255,0.2);
            border-radius: 13px;
            padding: 0 13px;
        }

        /* PACKAGES */

        .packages {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
        }

        .package {
            background: #090f20;
            color: white;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 13px 5px;
            text-align: center;
        }

        .package strong {
            display: block;
            font-size: 15px;
        }

        .package span {
            display: block;
            color: #8b96b1;
            font-size: 10px;
            margin-top: 4px;
        }

        .package.selected {
            border-color: #4d7cff;
            background: linear-gradient(145deg, rgba(77,124,255,0.2), rgba(139,92,246,0.13));
            box-shadow: 0 0 20px rgba(77,124,255,0.12);
        }

        /* PRICE */

        .price-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #090f20;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 14px;
            margin-top: 12px;
        }

        .price-label {
            color: var(--muted);
            font-size: 12px;
        }

        .price {
            font-size: 19px;
            font-weight: 800;
            text-align: right;
        }

        /* BUTTONS */

        .buy-button {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border-radius: 15px;
            color: white;
            font-size: 15px;
            font-weight: 800;
            background: linear-gradient(100deg, #426dff, #7253ef);
            box-shadow: 0 8px 28px rgba(77,124,255,0.22);
        }

        .buy-button:active {
            transform: scale(0.98);
        }

        .back-button {
            width: 100%;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.055);
            color: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px;
        }

        /* GIFT */

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .gift {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            color: white;
        }

        .gift.selected {
            border-color: #4d7cff;
            box-shadow: 0 0 20px rgba(77,124,255,0.13);
        }

        .gift-image {
            width: 65px;
            height: 65px;
            margin: 0 auto 8px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: linear-gradient(145deg, rgba(77,124,255,0.18), rgba(139,92,246,0.16));
        }

        .gift-name {
            font-size: 14px;
            font-weight: 700;
        }

        .gift-price {
            color: #8eb9ff;
            font-size: 12px;
            margin-top: 4px;
        }

        /* COUNTRIES */

        .country-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
            max-height: 430px;
            overflow-y: auto;
        }

        .country {
            background: #090f20;
            color: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 10px;
            text-align: left;
        }

        .country.selected {
            border-color: #4d7cff;
        }

        .country-name {
            font-size: 13px;
            font-weight: 700;
        }

        .country-price {
            color: #7e8aa8;
            font-size: 11px;
            margin-top: 3px;
        }

        /* UC */

        .uc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .uc {
            background: #090f20;
            color: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 14px;
            text-align: center;
        }

        .uc.selected {
            border-color: #4d7cff;
        }

        .uc strong {
            display: block;
            font-size: 16px;
        }

        .uc span {
            display: block;
            color: #7f8ba7;
            font-size: 11px;
            margin-top: 5px;
        }

        /* TOAST */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 30px);
            width: calc(100% - 35px);
            max-width: 500px;
            background: rgba(16,22,43,0.97);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 14px 16px;
            text-align: center;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* RESPONSIVE */

        @media (max-width: 380px) {
            .services { gap: 8px; }
            .service { padding: 15px; min-height: 130px; }
            .packages { grid-template-columns: repeat(2, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="lang-switch" role="group" aria-label="Til / Язык">
            <button type="button" class="lang-btn" data-lang="uz">UZ</button>
            <button type="button" class="lang-btn" data-lang="ru">RU</button>
        </div>

        <div class="logo">JV STARS</div>
        <a class="bot-link" href="https://t.me/jvstarsbot" target="_blank" rel="noopener">@jvstarsbot</a>
    </div>

    <!-- BALANCE -->

    <div class="balance-card">
        <div class="balance-title" data-i18n="balanceTitle"></div>
        <div class="balance">
            <span id="balance">0</span>
            <span class="uzs">UZS</span>
        </div>
    </div>


    <!-- ================= HOME ================= -->

    <section id="homePage" class="page active">

        <div class="section-title" data-i18n="servicesTitle"></div>
        <div class="section-description" data-i18n="servicesDesc"></div>

        <div class="services">

            <button type="button" class="service" data-page="starsPage">
                <div class="service-icon">⭐</div>
                <div class="service-name" data-i18n="svcStars"></div>
                <div class="service-desc" data-i18n="svcStarsDesc"></div>
            </button>

            <button type="button" class="service" data-page="premiumPage">
                <div class="service-icon">💎</div>
                <div class="service-name" data-i18n="svcPremium"></div>
                <div class="service-desc" data-i18n="svcPremiumDesc"></div>
            </button>

            <button type="button" class="service" data-page="giftsPage">
                <div class="service-icon">🎁</div>
                <div class="service-name" data-i18n="svcGifts"></div>
                <div class="service-desc" data-i18n="svcGiftsDesc"></div>
            </button>

            <button type="button" class="service" data-page="numbersPage">
                <div class="service-icon">📱</div>
                <div class="service-name" data-i18n="svcNumbers"></div>
                <div class="service-desc" data-i18n="svcNumbersDesc"></div>
            </button>

            <button type="button" class="service" data-page="pubgPage">
                <div class="service-icon">🎮</div>
                <div class="service-name" data-i18n="svcPubg"></div>
                <div class="service-desc" data-i18n="svcPubgDesc"></div>
            </button>

            <button type="button" class="service" data-page="topupPage">
                <div class="service-icon">💰</div>
                <div class="service-name" data-i18n="svcTopup"></div>
                <div class="service-desc" data-i18n="svcTopupDesc"></div>
            </button>

        </div>

    </section>


    <!-- ================= STARS ================= -->

    <section id="starsPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="starsTitle"></div>
        <div class="section-description" data-i18n="starsDesc"></div>

        <div class="form-card">

            <span class="label" data-i18n="starsAmount"></span>

            <div class="packages" id="starPacks"></div>

            <br>

            <span class="label" data-i18n="otherAmount"></span>

            <input id="customStars" type="text" inputmode="numeric" autocomplete="off" data-i18n-ph="starsPlaceholder">

            <div class="price-box">
                <span class="price-label" data-i18n="total"></span>
                <span class="price" id="starsTotal">0 UZS</span>
            </div>

        </div>

        <div class="form-card">

            <span class="label" data-i18n="toWhom"></span>

            <div class="recipient-row">
                <input id="starsUsername" type="text" placeholder="@username"
                       autocomplete="off" autocapitalize="none" spellcheck="false">
                <button type="button" class="small-button" data-self="starsUsername" data-i18n="forMe"></button>
            </div>

        </div>

        <button type="button" class="buy-button" data-buy="stars" data-i18n="buyStars"></button>

    </section>


    <!-- ================= PREMIUM ================= -->

    <section id="premiumPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="premiumTitle"></div>
        <div class="section-description" data-i18n="premiumDesc"></div>

        <div class="form-card">

            <span class="label" data-i18n="toWhom"></span>

            <div class="recipient-row">
                <input id="premiumUsername" type="text" placeholder="@username"
                       autocomplete="off" autocapitalize="none" spellcheck="false">
                <button type="button" class="small-button" data-self="premiumUsername" data-i18n="forMe"></button>
            </div>

        </div>

        <div class="form-card">

            <span class="label" data-i18n="term"></span>

            <div class="packages" id="premiumPacks"></div>

            <div class="price-box">
                <span class="price-label" data-i18n="priceWord"></span>
                <span class="price" id="premiumTotal"></span>
            </div>

        </div>

        <button type="button" class="buy-button" data-buy="premium" data-i18n="buyPremium"></button>

    </section>


    <!-- ================= GIFTS ================= -->

    <section id="giftsPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="giftsTitle"></div>
        <div class="section-description" data-i18n="giftsDesc"></div>

        <div class="gift-grid" id="giftGrid"></div>

        <div class="form-card" style="margin-top:14px;">

            <span class="label" data-i18n="toWhom"></span>

            <div class="recipient-row">
                <input id="giftUsername" type="text" placeholder="@username"
                       autocomplete="off" autocapitalize="none" spellcheck="false">
                <button type="button" class="small-button" data-self="giftUsername" data-i18n="forMe"></button>
            </div>

        </div>

        <div class="form-card">

            <span class="label" data-i18n="commentLabel"></span>

            <textarea id="giftComment" data-i18n-ph="commentPlaceholder"></textarea>

            <div class="field-note">
                <span data-i18n="commentHelp"></span>
                <span id="giftCommentCount">0 / 128</span>
            </div>

        </div>

        <div class="price-box">
            <span class="price-label" data-i18n="selectedGift"></span>
            <span class="price" id="giftTotal"></span>
        </div>

        <button type="button" class="buy-button" data-buy="gift" data-i18n="buyGift"></button>

    </section>


    <!-- ================= NUMBERS ================= -->

    <section id="numbersPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="numbersTitle"></div>
        <div class="section-description" data-i18n="numbersDesc"></div>

        <div class="form-card">

            <span class="label" data-i18n="serviceWord"></span>

            <select id="numberService">
                <option value="Telegram">Telegram</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Instagram">Instagram</option>
                <option value="Google">Google</option>
            </select>

        </div>

        <div class="country-grid" id="countryGrid"></div>

        <div class="price-box">
            <span class="price-label" data-i18n="selectedCountry"></span>
            <span class="price" id="numberTotal"></span>
        </div>

        <button type="button" class="buy-button" data-buy="number" data-i18n="buyNumber"></button>

    </section>


    <!-- ================= PUBG ================= -->

    <section id="pubgPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="pubgTitle"></div>
        <div class="section-description" data-i18n="pubgDesc"></div>

        <div class="form-card">

            <span class="label">PUBG ID</span>

            <input id="pubgId" type="text" inputmode="numeric" autocomplete="off" data-i18n-ph="pubgIdPlaceholder">

        </div>

        <div class="form-card">

            <span class="label" data-i18n="ucAmount"></span>

            <div class="uc-grid" id="ucGrid"></div>

        </div>

        <div class="price-box">
            <span class="price-label" data-i18n="selectedPack"></span>
            <span class="price" id="ucTotal"></span>
        </div>

        <button type="button" class="buy-button" data-buy="uc" data-i18n="buyUc"></button>

    </section>


    <!-- ================= TOP UP ================= -->

    <section id="topupPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="topupTitle"></div>
        <div class="section-description" data-i18n="topupDesc"></div>

        <div class="form-card">

            <span class="label" data-i18n="currentBalance"></span>

            <div class="price-box">
                <span class="price-label" data-i18n="balanceWord"></span>
                <span class="price"><span id="balance2">0</span> UZS</span>
            </div>

        </div>

        <div class="form-card">

            <span class="label" data-i18n="topupAmountLabel"></span>

            <input id="topupAmount" type="text" inputmode="numeric" autocomplete="off" data-i18n-ph="topupPlaceholder">

            <div class="packages" style="margin-top:12px;" id="topupPacks"></div>

        </div>

        <button type="button" class="buy-button" id="topupBtn" data-i18n="topupBtn"></button>

    </section>

</div>


<!-- TOAST -->

<div id="toast" class="toast" role="status" aria-live="polite"></div>


<script>
"use strict";

/* =========================================
   TELEGRAM
========================================= */

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try {
        tg.setHeaderColor("#050817");
        tg.setBackgroundColor("#050817");
    } catch (e) {}
}


/* =========================================
   TILLAR / ЯЗЫКИ (uz, ru)
   Yangi matn qo‘shish uchun ikkala tilga bir xil kalit yozing.
========================================= */

const I18N = {

    uz: {
        balanceTitle: "💰 Sizning balansingiz",
        servicesTitle: "🛍 Xizmatlar",
        servicesDesc: "Kerakli xizmatni tanlang",
        back: "← Orqaga",

        svcStars: "Telegram Stars",
        svcStarsDesc: "Stars sotib olish",
        svcPremium: "Telegram Premium",
        svcPremiumDesc: "Premium obuna",
        svcGifts: "Telegram Gifts",
        svcGiftsDesc: "Sovg‘alar yuborish",
        svcNumbers: "Virtual raqam",
        svcNumbersDesc: "100+ davlat",
        svcPubg: "PUBG UC",
        svcPubgDesc: "UC to‘ldirish",
        svcTopup: "Hisobni to‘ldirish",
        svcTopupDesc: "Balansni to‘ldirish",

        starsTitle: "⭐ Telegram Stars",

const LANG_STORAGE_KEY = "jv_lang";

let lang = "uz";

function detectLang() {
    // 1) Foydalanuvchi o‘zi UZ/RU tugmasini bosgan bo‘lsa — shu tanlov
    try {
        const saved = localStorage.getItem(LANG_STORAGE_KEY);
        if (saved && I18N[saved]) return saved;
    } catch (e) {}

    // 2) Telegram ilovasidagi til (masalan "ru"), bo‘lmasa brauzer tili
    let code = "";
    try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) {
            code = tg.initDataUnsafe.user.language_code;
        }
    } catch (e) {}

    if (!code) code = navigator.language || "";

    return String(code).toLowerCase().indexOf("ru") === 0 ? "ru" : "uz";
}

function t(key, vars) {
    const dict = I18N[lang] || I18N.uz;

    let text = dict[key] !== undefined ? dict[key] : (I18N.uz[key] !== undefined ? I18N.uz[key] : key);

    if (vars) {
        Object.keys(vars).forEach(function (name) {
            text = text.split("{" + name + "}").join(vars[name]);
        });
    }

    return text;
}

// 1 месяц / 3 месяца / 12 месяцев (ruscha qoidasi), o‘zbekchada "N oy"
function monthsLabel(n) {
    let key = "monthsMany";

    if (lang === "ru") {
        if (n === 1) key = "monthsOne";
        else if (n >= 2 && n <= 4) key = "monthsFew";
    }

    return t(key, { n: n });
}

const $ = (id) => document.getElementById(id);

function formatMoney(number) {
    // Intl.NumberFormat("uz-UZ") turli qurilmalarda har xil chiqadi, shuning uchun o‘zimiz formatlaymiz
    return String(Math.round(Number(number) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00A0");
}

function digitsOnly(value, maxLength) {
    return String(value).replace(/\D/g, "").slice(0, maxLength);
}

function countryName(country) {
    return country.flag + " " + (lang === "ru" ? country.ru : country.uz);
}

// Balansni backend’dan olgach shu funksiyani chaqiring: setBalance(125000)
function setBalance(value) {
    balance = Math.max(0, Number(value) || 0);
    $("balance").textContent = formatMoney(balance);
    $("balance2").textContent = formatMoney(balance);
}

function setInvalid(inputId, isInvalid) {
    $(inputId).classList.toggle("invalid", !!isInvalid);
}

function selectOnly(containerSelector, element) {
    document.querySelectorAll(containerSelector).forEach(function (item) {
        item.classList.toggle("selected", item === element);
    });
}

// "@Username", "username", "https://t.me/username" -> "@username" (yoki null)
function normalizeUsername(raw) {
    let value = String(raw).trim().replace(/^https?:\/\/t\.me\//i, "").replace(/^@/, "");

    // Telegram: 5–32 belgi, harf bilan boshlanadi, harf/raqam/pastki chiziq
    if (!/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(value)) return null;

    return "@" + value;
}

// "Kimga?" maydonini tekshiradi. To‘g‘ri bo‘lsa "@username", aks holda xabar chiqarib null qaytaradi
function readUsername(inputId) {
    const raw = $(inputId).value.trim();

    if (!raw) {
        setInvalid(inputId, true);
        showToast(t("toastWho"));
        return null;
    }

    const username = normalizeUsername(raw);

    if (!username) {
        setInvalid(inputId, true);
        showToast(t("toastUserBad"));
        return null;
    }

    return username;
}

function calculateStars() {
    const input = $("customStars");
    const digits = digitsOnly(input.value, String(STARS_MAX).length);

    let amount = digits ? parseInt(digits, 10) : 0;
    if (amount > STARS_MAX) amount = STARS_MAX;

    // Yozayotganda minimumga "sakratmaymiz" — faqat yuqori chegarani cheklaymiz
    input.value = digits ? String(amount) : "";
    selectedStars = amount;

    setInvalid("customStars", amount > 0 && amount < STARS_MIN);

    $("starsTotal").textContent = amount >= STARS_MIN
        ? formatMoney(amount * STAR_PRICE_PER_UNIT) + " UZS"
        : "0 UZS";

    document.querySelectorAll("#starsPage .package").forEach(function (pack) {
        pack.classList.toggle("selected", Number(pack.dataset.stars) === amount);
    });
}

function selectStars(amount) {
    $("customStars").value = amount;
    calculateStars();
}

    if (amount > TOPUP_MAX) amount = TOPUP_MAX;

        const input = $(inputId);
        input.value = "@" + user.username;
        setInvalid(inputId, false);
        return;
    }

    showToast(t("toastNoUsername"));
}


/* =========================================
   SOTIB OLISH
   service: stars | premium | gift | number | uc
========================================= */

const SERVICE_NAME_KEYS = {
    stars:   "nameStars",
    premium: "namePremium",
    gift:    "nameGift",
    number:  "nameNumber",
    uc:      "nameUc"
};

function buyService(service) {

    if (service === "stars") {
        if (!selectedStars) {
            showToast(t("toastStarsChoose"));
            return;
        }

        if (selectedStars < STARS_MIN) {
            setInvalid("customStars", true);
            showToast(t("toastStarsMin", { n: STARS_MIN }));
            return;
        }

        if (!readUsername("starsUsername")) return;
    }


    if (service === "premium") {
        if (!selectedPremium) {
            showToast(t("toastPremiumChoose"));
            return;
        }

        if (!readUsername("premiumUsername")) return;
    }


    if (service === "gift") {
        if (!selectedGift) {
            showToast(t("toastGiftChoose"));
            return;
        }

        const username = readUsername("giftUsername");
        if (!username) return;

        // Izoh ixtiyoriy: bo‘sh bo‘lsa "" bo‘ladi
        lastGiftOrder = {
            type: "gift",
            gift: selectedGift.name,
            price: selectedGift.price,
            username: username,
            comment: getGiftComment(),
            lang: lang
        };
    }


    if (service === "number") {
        if (!selectedCountry) {
            showToast(t("toastCountryChoose"));
            return;
        }
    }


    if (service === "uc") {
        const pubgId = digitsOnly($("pubgId").value, 15);

        if (!pubgId) {
            setInvalid("pubgId", true);
            showToast(t("toastPubgEmpty"));
            return;
        }

        if (pubgId.length < 5) {
            setInvalid("pubgId", true);
            showToast(t("toastPubgShort"));
            return;
        }

        if (!selectedUC) {
            showToast(t("toastUcChoose"));
            return;
        }
    }


    showToast(t("toastNoProvider", { service: t(SERVICE_NAME_KEYS[service] || "nameStars") }));
}


/* =========================================
   HODISALAR (CLICK / INPUT)
========================================= */

document.addEventListener("click", function (event) {
    const target = event.target;

    const langBtn = target.closest("[data-lang]");
    if (langBtn) { setLang(langBtn.dataset.lang, true); return; }

    const nav = target.closest("[data-page]");
    if (nav) { openPage(nav.dataset.page); return; }

    if (target.closest("[data-back]")) { goHome(); return; }

    const self = target.closest("[data-self]");
    if (self) { myself(self.dataset.self); return; }

    const buy = target.closest("[data-buy]");
    if (buy) { buyService(buy.dataset.buy); return; }

    const stars = target.closest("[data-stars]");
    if (stars) { selectStars(Number(stars.dataset.stars)); return; }

    const premium = target.closest("[data-premium]");
    if (premium) { selectPremium(Number(premium.dataset.premium), premium); return; }

    const gift = target.closest("[data-gift]");
    if (gift) { selectGift(Number(gift.dataset.gift), gift); return; }

    const country = target.closest("[data-country]");
    if (country) { selectCountry(Number(country.dataset.country), country); return; }

    const uc = target.closest("[data-uc]");
    if (uc) { selectUC(Number(uc.dataset.uc), uc); return; }

    const preset = target.closest("[data-topup]");
    if (preset) { setTopup(Number(preset.dataset.topup)); return; }
});

$("customStars").addEventListener("input", calculateStars);
$("topupAmount").addEventListener("input", getTopupAmount);
$("topupBtn").addEventListener("click", topup);
$("giftComment").addEventListener("input", limitGiftComment);

$("pubgId").addEventListener("input", function () {
    this.value = digitsOnly(this.value, 15);
    setInvalid("pubgId", false);
});

["starsUsername", "premiumUsername", "giftUsername"].forEach(function (id) {
    $(id).addEventListener("input", function () { setInvalid(id, false); });
});


/* =========================================
   URL SERVICE
   Botdan keladigan:
   ?service=stars
   ?service=premium
   ?service=gifts
   ?service=numbers
   ?service=pubg (yoki gift_rental)
   ?service=topup
   Ixtiyoriy: ?lang=ru yoki ?lang=uz
========================================= */

const SERVICE_MAP = {
    stars:       "starsPage",
    premium:     "premiumPage",
    gifts:       "giftsPage",
    numbers:     "numbersPage",
    pubg:        "pubgPage",
    uc:          "pubgPage",
    gift_rental: "pubgPage",
    topup:       "topupPage"
};

function openServiceFromURL() {
    const service = new URLSearchParams(window.location.search).get("service");
    if (!service) return;

    if (Object.prototype.hasOwnProperty.call(SERVICE_MAP, service)) {
        openPage(SERVICE_MAP[service]);
    }
}


/* =========================================
   INIT
========================================= */

const urlLang = new URLSearchParams(window.location.search).get("lang");

lang = (urlLang && I18N[urlLang]) ? urlLang : detectLang();

applyLanguage();
limitGiftComment();
setBalance(balance);
openServiceFromURL();
</script>
