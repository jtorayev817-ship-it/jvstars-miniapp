<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050817">

    <title>JV Stars</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050817;
            --card: #0d1226;
            --card2: #111832;
            --text: #ffffff;
            --muted: #8992ad;
            --blue: #4d7cff;
            --cyan: #00d9ff;
            --purple: #8b5cf6;
            --green: #20d67b;
            --border: rgba(255,255,255,0.08);
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(77,124,255,0.28), transparent 40%),
                radial-gradient(circle at 100% 40%, rgba(139,92,246,0.14), transparent 35%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 18px 15px 35px;
        }

        /* HEADER */

        .header {
            position: relative;
            text-align: center;
            margin-bottom: 20px;
        }

        .lang-switch {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.055);
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
        }

        .lang-btn.active {
            color: white;
            border-color: rgba(77,124,255,0.6);
            background: linear-gradient(145deg, rgba(77,124,255,0.28), rgba(139,92,246,0.2));
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #62dfff, #8d6cff, #ffffff);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 5s linear infinite;
            text-shadow: 0 0 25px rgba(77,124,255,0.35);
        }

        @keyframes glowText {
            0%   { background-position: 0% center; }
            50%  { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .bot-link {
            display: inline-block;
            margin-top: 5px;
            color: #8fdfff;
            font-size: 14px;
            text-decoration: none;
        }

        /* BALANCE */

        .balance-card {
            background: linear-gradient(135deg, rgba(77,124,255,0.18), rgba(139,92,246,0.12));
            border: 1px solid rgba(120,150,255,0.18);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 22px;
            box-shadow: 0 0 35px rgba(77,124,255,0.08);
        }

        .balance-title {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .balance {
            font-size: 28px;
            font-weight: 800;
        }

        .uzs {
            font-size: 14px;
            color: var(--muted);
            margin-left: 5px;
        }

        /* PAGES */

        .page { display: none; }

        .page.active {
            display: block;
            animation: pageIn 0.25s ease;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .section-description {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 18px;
        }

        /* SERVICES */

        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .service {
            position: relative;
            overflow: hidden;
            min-height: 145px;
            background: linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018));
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px 16px;
            color: white;
            text-align: left;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .service:hover,
        .service:active {
            transform: translateY(-2px);
            border-color: rgba(90,150,255,0.45);
            box-shadow: 0 0 28px rgba(77,124,255,0.13);
        }

        .service::after {
            content: "";
            position: absolute;
            width: 80px;
            height: 80px;
            right: -30px;
            bottom: -35px;
            border-radius: 50%;
            background: rgba(77,124,255,0.14);
            filter: blur(15px);
        }

        .service-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .service-name {
            font-size: 16px;
            font-weight: 800;
        }

        .service-desc {
            color: var(--muted);
            font-size: 11px;
            margin-top: 5px;
        }

        /* FORM */

        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .label {
            display: block;
            color: #aeb6ce;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            background: #080d1d;
            color: white;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 14px;
            padding: 14px;
            outline: none;
            font-size: 16px; /* iOS'da yaqinlashib ketmasligi uchun */
            transition: border-color 0.2s;
        }

        textarea {
            display: block;
            resize: none;
            min-height: 86px;
            line-height: 1.4;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: rgba(77,124,255,0.65);
        }

        input.invalid {
            border-color: rgba(255,92,122,0.75);
        }

        input::placeholder,
        textarea::placeholder {
            color: #5d6680;
        }

        .field-note {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 7px;
            color: var(--muted);
            font-size: 11px;
        }

        .recipient-row {
            display: flex;
            gap: 8px;
        }

        .recipient-row input {
            flex: 1;
            min-width: 0;
        }

        .small-button {
            white-space: nowrap;
            background: rgba(77,124,255,0.14);
            color: #8fc2ff;
            border: 1px solid rgba(77,124,255,0.2);
            border-radius: 13px;
            padding: 0 13px;
        }

        /* PACKAGES */

        .packages {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
        }

        .package {
            background: #090f20;
            color: white;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 13px 5px;
            text-align: center;
        }

        .package strong {
            display: block;
            font-size: 15px;
        }

        .package span {
            display: block;
            color: #8b96b1;
            font-size: 10px;
            margin-top: 4px;
        }

        .package.selected {
            border-color: #4d7cff;
            background: linear-gradient(145deg, rgba(77,124,255,0.2), rgba(139,92,246,0.13));
            box-shadow: 0 0 20px rgba(77,124,255,0.12);
        }

        /* PRICE */

        .price-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #090f20;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 14px;
            margin-top: 12px;
        }

        .price-label {
            color: var(--muted);
            font-size: 12px;
        }

        .price {
            font-size: 19px;
            font-weight: 800;
            text-align: right;
        }

        /* BUTTONS */

        .buy-button {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border-radius: 15px;
            color: white;
            font-size: 15px;
            font-weight: 800;
            background: linear-gradient(100deg, #426dff, #7253ef);
            box-shadow: 0 8px 28px rgba(77,124,255,0.22);
        }

        .buy-button:active {
            transform: scale(0.98);
        }

        .back-button {
            width: 100%;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.055);
            color: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px;
        }

        /* GIFT */

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .gift {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            color: white;
        }

        .gift.selected {
            border-color: #4d7cff;
            box-shadow: 0 0 20px rgba(77,124,255,0.13);
        }

        .gift-image {
            width: 65px;
            height: 65px;
            margin: 0 auto 8px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: linear-gradient(145deg, rgba(77,124,255,0.18), rgba(139,92,246,0.16));
        }

        .gift-name {
            font-size: 14px;
            font-weight: 700;
        }

        .gift-price {
            color: #8eb9ff;
            font-size: 12px;
            margin-top: 4px;
        }

        /* COUNTRIES */

        .country-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
            max-height: 430px;
            overflow-y: auto;
        }

        .country {
            background: #090f20;
            color: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 10px;
            text-align: left;
        }

        .country.selected {
            border-color: #4d7cff;
        }

        .country-name {
            font-size: 13px;
            font-weight: 700;
        }

        .country-price {
            color: #7e8aa8;
            font-size: 11px;
            margin-top: 3px;
        }

        /* UC */

        .uc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .uc {
            background: #090f20;
            color: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 14px;
            text-align: center;
        }

        .uc.selected {
            border-color: #4d7cff;
        }

        .uc strong {
            display: block;
            font-size: 16px;
        }

        .uc span {
            display: block;
            color: #7f8ba7;
            font-size: 11px;
            margin-top: 5px;
        }

        /* TOAST */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 30px);
            width: calc(100% - 35px);
            max-width: 500px;
            background: rgba(16,22,43,0.97);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 14px 16px;
            text-align: center;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* RESPONSIVE */

        @media (max-width: 380px) {
            .services { gap: 8px; }
            .service { padding: 15px; min-height: 130px; }
            .packages { grid-template-columns: repeat(2, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="lang-switch" role="group" aria-label="Til / Язык">
            <button type="button" class="lang-btn" data-lang="uz">UZ</button>
            <button type="button" class="lang-btn" data-lang="ru">RU</button>
        </div>

        <div class="logo">JV STARS</div>
        <a class="bot-link" href="https://t.me/jvstarsbot" target="_blank" rel="noopener">@jvstarsbot</a>
    </div>

    <!-- BALANCE -->

    <div class="balance-card">
        <div class="balance-title" data-i18n="balanceTitle"></div>
        <div class="balance">
            <span id="balance">0</span>
            <span class="uzs">UZS</span>
        </div>
    </div>


    <!-- ================= HOME ================= -->

    <section id="homePage" class="page active">

        <div class="section-title" data-i18n="servicesTitle"></div>
        <div class="section-description" data-i18n="servicesDesc"></div>

        <div class="services">

            <button type="button" class="service" data-page="starsPage">
                <div class="service-icon">⭐</div>
                <div class="service-name" data-i18n="svcStars"></div>
                <div class="service-desc" data-i18n="svcStarsDesc"></div>
            </button>

            <button type="button" class="service" data-page="premiumPage">
                <div class="service-icon">💎</div>
                <div class="service-name" data-i18n="svcPremium"></div>
                <div class="service-desc" data-i18n="svcPremiumDesc"></div>
            </button>

            <button type="button" class="service" data-page="giftsPage">
                <div class="service-icon">🎁</div>
                <div class="service-name" data-i18n="svcGifts"></div>
                <div class="service-desc" data-i18n="svcGiftsDesc"></div>
            </button>

            <button type="button" class="service" data-page="numbersPage">
                <div class="service-icon">📱</div>
                <div class="service-name" data-i18n="svcNumbers"></div>
                <div class="service-desc" data-i18n="svcNumbersDesc"></div>
            </button>

            <button type="button" class="service" data-page="pubgPage">
                <div class="service-icon">🎮</div>
                <div class="service-name" data-i18n="svcPubg"></div>
                <div class="service-desc" data-i18n="svcPubgDesc"></div>
            </button>

            <button type="button" class="service" data-page="topupPage">
                <div class="service-icon">💰</div>
                <div class="service-name" data-i18n="svcTopup"></div>
                <div class="service-desc" data-i18n="svcTopupDesc"></div>
            </button>

        </div>

    </section>


    <!-- ================= STARS ================= -->

    <section id="starsPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="starsTitle"></div>
        <div class="section-description" data-i18n="starsDesc"></div>

        <div class="form-card">

            <span class="label" data-i18n="starsAmount"></span>

            <div class="packages" id="starPacks"></div>

            <br>

            <span class="label" data-i18n="otherAmount"></span>

            <input id="customStars" type="text" inputmode="numeric" autocomplete="off" data-i18n-ph="starsPlaceholder">

            <div class="price-box">
                <span class="price-label" data-i18n="total"></span>
                <span class="price" id="starsTotal">0 UZS</span>
            </div>

        </div>

        <div class="form-card">

            <span class="label" data-i18n="toWhom"></span>

            <div class="recipient-row">
                <input id="starsUsername" type="text" placeholder="@username"
                       autocomplete="off" autocapitalize="none" spellcheck="false">
                <button type="button" class="small-button" data-self="starsUsername" data-i18n="forMe"></button>
            </div>

        </div>

        <button type="button" class="buy-button" data-buy="stars" data-i18n="buyStars"></button>

    </section>


    <!-- ================= PREMIUM ================= -->

    <section id="premiumPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="premiumTitle"></div>
        <div class="section-description" data-i18n="premiumDesc"></div>

        <div class="form-card">

            <span class="label" data-i18n="toWhom"></span>

            <div class="recipient-row">
                <input id="premiumUsername" type="text" placeholder="@username"
                       autocomplete="off" autocapitalize="none" spellcheck="false">
                <button type="button" class="small-button" data-self="premiumUsername" data-i18n="forMe"></button>
            </div>

        </div>

        <div class="form-card">

            <span class="label" data-i18n="term"></span>

            <div class="packages" id="premiumPacks"></div>

            <div class="price-box">
                <span class="price-label" data-i18n="priceWord"></span>
                <span class="price" id="premiumTotal"></span>
            </div>

        </div>

        <button type="button" class="buy-button" data-buy="premium" data-i18n="buyPremium"></button>

    </section>


    <!-- ================= GIFTS ================= -->

    <section id="giftsPage" class="page">

        <button type="button" class="back-button" data-back data-i18n="back"></button>

        <div class="section-title" data-i18n="giftsTitle"></div>
        <div class="section-description" data-i18n="giftsDesc"></div>

        <div class="gift-grid" id="giftGrid"></div>

        <div class="form-card" style="margin-top:14px;">

            <span class="label" data-i18n="toWhom"></span>

            <div class="recipient-row">
                <input id="giftUsername" type="text" placeholder="@username"
                       autocomplete="off" autocapitalize="none" spellcheck="false">
                <button type="button" class="small-button" data-self="giftUsername" data-i18n="forMe"></button>
            </div>

        </div>

        <div class="form-card">

            <span class="label" data-i18n="commentLabel"></span>

            <textarea id="giftComment" data-i18n-ph="commentPlaceholder"></textarea>

            <div class="field-note">
                <span data-i18n="commentHelp"></span>
                <span id="giftCommentCount">0 / 128</span>
            </div>

        </div>

        <div class="price-box">
            <span class="price-label" data-i18n="selectedGift"></span>
            <span class="price" id="giftTotal"></span>
        </div>

        <button type="button" class="buy-button" data-buy="gift" data-i18n="buyGift"></button>

    </section>


    <!-- ================= NUMBERS ================= -->

    <section id="numbersPage"
